name: ETICS - Tests et Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vérifier les workflows avec actionlint
        run: |
          docker run --rm --mount "type=bind,source=$PWD/.github,target=/repo/.github,readonly" \
            -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/ci.yml .github/workflows/terraform-azure.yml

  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: etics-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: etics_ci
      POSTGRES_USER: etics_ci
      POSTGRES_PASSWORD: disposable-ci-password
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Préparer les volumes du runner Linux
        run: |
          mkdir -p data/raw data/extracted data/processed backups runtime
          sudo chown -R 1000:1000 data backups runtime
      - name: Construire et démarrer les services isolés
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Tester avec PostgreSQL réel et des clients LLM simulés
        run: |
          docker compose exec -T worker python -m src.container test \
            -q -p no:cacheprovider --junitxml=/app/runtime/pytest-ci.xml
      - name: Vérifier la disponibilité du dashboard
        run: curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health
      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-postgresql
          path: runtime/pytest-ci.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Afficher les journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Nettoyer uniquement les ressources de ce runner CI
        if: always()
        run: docker compose down --volumes --remove-orphans

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Isoler le cache Terraform du dépôt
        run: echo "TF_DATA_DIR=$RUNNER_TEMP/etics-terraform" >> "$GITHUB_ENV"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - name: Tester le plan avec un fournisseur simulé, sans accès Azure
        run: terraform test -no-color

