services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etics_db}
      POSTGRES_USER: ${POSTGRES_USER:-etics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etics123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etics} -d ${POSTGRES_DB:-etics_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
